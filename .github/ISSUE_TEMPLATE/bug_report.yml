name: Bug report
description: Report a problem with Hybrid Dev Orchestrator itself.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for problems with HDO itself.

        Looking for the **HDO implementation task** form? That is HDO's own issue
        contract, meant to be copied into repositories you run HDO against — not a
        way to report bugs here.

        **Do not report security vulnerabilities here.** See
        [SECURITY.md](https://github.com/kkb-hub/hybrid-dev-orchestrator/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact command you ran, ideally with `-Json`.
      placeholder: |
        1. node src/cli/main.ts doctor -DryRun -Json
        2. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: |
        Relevant stdout/stderr. **Redact tokens and anything private** — HDO redacts
        secrets in its own logs, but paste with care.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: HDO version
      description: The `version` field in `.claude-plugin/plugin.json`, or the commit SHA.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Output of `node --version`, `$PSVersionTable.PSVersion`, `git --version`,
        `gh --version`, and your Windows version.
      render: text
    validations:
      required: true

  - type: dropdown
    id: runner
    attributes:
      label: Which runner were you using?
      multiple: true
      options:
        - claude (default)
        - codex
        - ollama
        - command adapter
        - not applicable
    validations:
      required: false
