name: typescript

# CI for the production TypeScript implementation (ADR-0001). Windows-only per
# ADR-0001 Amendment 2026-09-05: the migration's first target is Windows, so
# ubuntu-latest is intentionally not a gate here (unlike poc-typescript.yml, which
# keeps its ubuntu-latest job as PoC-only informational evidence and is not touched
# by this workflow). This workflow is the regression gate for the Migration
# strategy phases as they land - phase 1 (core contracts / config / state), phase 2
# (process / platform), phase 3 (git), phase 4 (github), phase 5 (runners), phase 6
# (workflow), and now phase 7 (cli / plugin: issues/inspect/cleanup/labels wired
# into src/cli/main.ts, the phase-7 parity tests under src/cli/*Parity.test.ts and
# their tests/fixtures/cli/** fixture, and the commands/*.md + skills/*/SKILL.md
# cut-over to `node`) - and will grow to cover later migration phases in place,
# without renaming.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "commands/**"
      - "skills/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "schemas/**"
      - "config/**"
      - "tests/fixtures/**"
      - ".hdo/**"
      - "hdo.ps1"
      - ".github/workflows/typescript.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "commands/**"
      - "skills/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "schemas/**"
      - "config/**"
      - "tests/fixtures/**"
      - ".hdo/**"
      - "hdo.ps1"
      - ".github/workflows/typescript.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: windows-latest
    # Phase 6 added src/cli/runParity.test.ts (13 NoWriteBack full-run scenarios,
    # one pwsh child process + one node child process each, run sequentially per
    # ADR-0001 phase 6 plan §7 Q3). Measured wall time on the dev machine is
    # ~3.5-4.5 min for that file alone; give the whole job headroom instead of
    # relying on the default (unbounded) GitHub Actions job timeout.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Help smoke
        run: node src/cli/main.ts help

      - name: Config preflight
        run: node src/cli/main.ts config -Json

      - name: Doctor preflight
        shell: pwsh
        run: |
          # windows-latest has git/gh/pwsh but not claude/codex/ollama, so the
          # default claude-only profile's `runner:*` checks fail and `doctor`
          # exits 3 (not ok) - that is an expected, informative preflight result
          # here, not a CI failure. Only a genuine crash (any other exit code)
          # should fail this step. The Actions pwsh wrapper runs with
          # $ErrorActionPreference = 'Stop' and re-exits with the last native
          # exit code, so both are neutralised explicitly here: native non-zero
          # exits must not terminate the script, and the step's own exit code is
          # decided by the check below instead of by node's 3.
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          node src/cli/main.ts doctor -DryRun -Json
          $code = $LASTEXITCODE
          if ($code -notin @(0, 3)) {
            Write-Host "::error::doctor -DryRun -Json exited $code (expected 0 or 3)"
            exit 1
          }
          Write-Host "doctor -DryRun -Json exited $code (accepted: 0 = ok, 3 = preflight not ok)"
          exit 0
