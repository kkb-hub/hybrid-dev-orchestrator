name: test-suite

# HDO 本体の deterministic PowerShell regression suite。
# 現在の正式対象である Windows native を PR / main push の gate にする。
# ADR-0001 により Linux / WSL2 対応は TypeScript 実装側で扱うため、この PowerShell suite に ubuntu-latest を追加する予定はない。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Run full PowerShell test suite
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/test-suite.ps1
